name: Deploy Hugo output to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare generated site
        run: |
          mkdir -p "$RUNNER_TEMP/pages-site"
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='dist/' --exclude='public/' ./ "$RUNNER_TEMP/pages-site/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
